services:
  mysql:
    image: mysql:8.4
    container_name: netdisk-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: netdisk
      TZ: UTC
    ports:
      - "3306:3306"
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    volumes:
      - netdisk_mysql:/var/lib/mysql

  redis:
    image: redis:7.4
    container_name: netdisk-redis
    ports:
      - "6379:6379"
    volumes:
      - netdisk_redis:/data

  minio:
    image: minio/minio:RELEASE.2025-01-15T00-00-00Z
    container_name: netdisk-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - netdisk_minio:/data

  minio-init:
    image: minio/mc:RELEASE.2025-01-15T00-00-00Z
    container_name: netdisk-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb -p local/netdisk || true;
      mc anonymous set download local/netdisk || true;
      exit 0;
      "

volumes:
  netdisk_mysql:
  netdisk_redis:
  netdisk_minio:
